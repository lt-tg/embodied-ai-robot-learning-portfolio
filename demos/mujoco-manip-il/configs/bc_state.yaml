seed: 42
task: robosuite/Lift
observations:
  use_rgb: false
  use_proprioception: true
policy:
  name: bc_mlp
  hidden_sizes: [256, 256, 256]
training:
  batch_size: 256
  learning_rate: 0.0003
  epochs: 100
  checkpoint_every: 10
evaluation:
  episodes: 50
  metrics: [success_rate, action_mse, latency_ms]
